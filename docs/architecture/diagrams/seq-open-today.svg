t><text x="32.0" y="62.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="13" font-weight="400" fill="#64656C" text-anchor="start">Occurrences are computed from schedules on the device and stored only once the user touches them.</text><text x="232.0" y="181.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B1A22" text-anchor="middle">open app / pick a date on the strip</text><text x="471.4" y="221.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B1A22" text-anchor="middle">active items + stored occurrences for date</text><text x="471.4" y="261.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64656C" text-anchor="middle">rows</text><text x="558.4" y="301.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B1A22" text-anchor="middle">times(date, lat/lng, method, madhab)</text><text x="558.4" y="341.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64656C" text-anchor="middle">Fajr · Sunrise · Zuhr · Asr · Maghrib · Isha</text><text x="645.4" y="381.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B1A22" text-anchor="middle">expand(items, date, prayerTimes)</text><rect x="841.7149999999999" y="414" width="220" height="110" rx="8" fill="#FFF5D2" stroke="#CFA302" stroke-width="1"/><text x="951.7" y="433.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B1A22" text-anchor="middle">once · daily · weekdays · every N</text><text x="951.7" y="449.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B1A22" text-anchor="middle">days · monthly. &#x27;Surah Kahf ·</text><text x="951.7" y="465.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B1A22" text-anchor="middle">Friday · after Zuhr&#x27; → only on</text><text x="951.7" y="481.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B1A22" text-anchor="middle">Fridays, active Zuhr→Asr. Skips</text><text x="951.7" y="497.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B1A22" text-anchor="middle">archived items and dates outside</text><text x="951.7" y="513.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B1A22" text-anchor="middle">activeFrom/Until.</text><text x="645.4" y="545.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64656C" text-anchor="middle">virtual occurrences</text><text x="381.0" y="594.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B1A22" text-anchor="start">merge with stored (stored wins)</text><text x="732.4" y="647.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B1A22" text-anchor="middle">progress(occurrences)</text><rect x="1015.7149999999999" y="680" width="220" height="62" rx="8" fill="#FFF5D2" stroke="#CFA302" stroke-width="1"/><text x="1125.7" y="699.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B1A22" text-anchor="middle">required = not optional, not</text><text x="1125.7" y="715.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B1A22" text-anchor="middle">skipped, not moved. % = done ÷</text><text x="1125.7" y="731.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B1A22" text-anchor="middle">required; nothing required → 100%.</text><text x="732.4" y="763.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64656C" text-anchor="middle">% + counts To Do / In Progress / Done</text><text x="232.0" y="803.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64656C" text-anchor="middle">status tiles, lists, day ring</text></svg>