 stroke="#64656C" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="311.85999999999996" y1="228" x2="514.4549999999999" y2="228" stroke="#64656C" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="520.4549999999999" y1="344" x2="787.9099999999999" y2="344" stroke="#64656C" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="520.4549999999999" y1="384" x2="973.9649999999998" y2="384" stroke="#64656C" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="520.4549999999999" y1="424" x2="317.85999999999996" y2="424" stroke="#64656C" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><line x1="311.85999999999996" y1="464" x2="131.0" y2="464" stroke="#64656C" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><path d="M979.9649999999998 522 H1013.9649999999998 V544 H985.9649999999998" fill="none" stroke="#64656C" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="979.9649999999998" y1="618" x2="1193.1399999999999" y2="618" stroke="#64656C" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M1199.1399999999999 650 H1233.1399999999999 V672 H1205.1399999999999" fill="none" stroke="#64656C" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="1199.1399999999999" y1="720" x2="1432.8999999999999" y2="720" stroke="#64656C" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="1199.1399999999999" y1="760" x2="1628.2699999999998" y2="760" stroke="#64656C" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="1199.1399999999999" y1="800" x2="985.9649999999998" y2="800" stroke="#64656C" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><line x1="979.9649999999998" y1="840" x2="799.9099999999999" y2="840" stroke="#64656C" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="1634.2699999999998" y1="898" x2="1444.8999999999999" y2="898" stroke="#64656C" stroke-width="1.4" marker-end="url(#arrow)"/><text x="32.0" y="40.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="20" font-weight="600" fill="#1B1A22" text-anchor="start">Sequence — one-tap prayer, offline first</text><text x="32.0" y="62.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="13" font-weight="400" fill="#64656C" text-anchor="start">Marking Asr while Fajr is still open. No order is enforced; the write is local first and syncs when online.</text><text x="218.4" y="181.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B1A22" text-anchor="middle">tap Asr ✓  (Fajr not marked)</text><text x="416.2" y="221.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B1A22" text-anchor="middle">complete(occurrence: Asr, today)</text><rect x="410.4549999999999" y="254" width="220" height="62" rx="8" fill="#FFF5D2" stroke="#CFA302" stroke-width="1"/><text x="520.5" y="273.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B1A22" text-anchor="middle">No sequence rule: any prayer can</text><text x="520.5" y="289.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B1A22" text-anchor="middle">be marked; Fajr can stay open or</text><text x="520.5" y="305.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B1A22" text-anchor="middle">be marked missed.</text><text x="657.2" y="337.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B1A22" text-anchor="middle">upsert occurrence status=done, completedAt</text><text x="750.2" y="377.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B1A22" text-anchor="middle">enqueue {occurrence, upsert}</text><text x="416.2" y="417.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64656C" text-anchor="middle">ring 3/5, day %</text><text x="218.4" y="457.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64656C" text-anchor="middle">ring fills, row moves to Done</text><text x="1022.0" y="532.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B1A22" text-anchor="start">keep queued; retry on &#x27;online&#x27; event</text><text x="1089.6" y="611.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B1A22" text-anchor="middle">POST /v1/sync/push  (Bearer JWT)</text><text x="1241.1" y="660.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B1A22" text-anchor="start">verify each row belongs to caller</text><text x="1319.0" y="713.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B1A22" text-anchor="middle">upsert (last-write-wins by updatedAt)</text><text x="1416.7" y="753.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B1A22" text-anchor="middle">enqueue rewards.evaluate</text><text x="1089.6" y="793.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64656C" text-anchor="middle">ack + serverTime</text><text x="886.9" y="833.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B1A22" text-anchor="middle">clear sent rows, save cursor</text><text x="1536.6" y="891.0" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B1A22" text-anchor="middle">points +2, prayer streak check</text></svg>